interface:
  display_name: "Lens Cap Production"
  short_description: "Exclusive printable lens-cap route"
  brand_color: "#252525"
  default_prompt: >-
    Use $lens-cap-production as the only production/design Skill for lens-cap
    relief, fit, CAD, SCAD, STL, 3MF, or printer-handoff requests. A named
    camera lens plus a circular front, relief, fitted cap, circular image or
    artwork, lens-cover model, printable model, or 3MF is the same intent even
    when “lens cap” is omitted; optical design, repair, and unrelated product
    photos are excluded. Natural wording such as “make a printable model for
    this lens” is included only when the requested object is the cap/front
    surface. Do not
    invoke generic mechanical-CAD, product-design, graphic-design, logo,
    poster, UI, or other design Skills in parallel. Preserve approved artwork
    with focal length as the first visual read and maximum aperture
    (F-stop/F-number/F value) as the second. Before fitted geometry, ask one
    grouped question for mating diameter, foam/uncompressed thickness, and
    friction-rib preference; ribs are enabled by default. If approved artwork
    is missing, sequence $lens-cap-imagegen first and then return here. Do not
    treat an unsaved provider attachment as a source or fabricate its
    approval/hash/circle handoff.
