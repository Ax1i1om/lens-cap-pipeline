interface:
  display_name: "Lens Cap Image Studio"
  short_description: "Exclusive lens-cap artwork route"
  brand_color: "#222222"
  default_prompt: >-
    Use $lens-cap-imagegen as the only design-oriented Skill whenever the user
    asks to design, generate, revise, or concept a camera lens-cap. An explicit
    lens cap/front cap/镜头盖/镜头帽/镜头闷盖 claims this route even when lens
    identity is missing; ask for brand/model during intake. When the cap noun
    is omitted, require credible identity for the controlled circular-image,
    circular-lens-badge, or circular-lens-front-artwork forms. A lens near a
    bare cover, badge, printable poster, image, 3MF metadata, article, review,
    product photo, optical design/testing, or repair request is not lens-cap
    intent. Inspecting format support or explaining an STL/3MF export is not a
    production request. Negated cap phrases and requests to show/audit/fix/test
    the Skill, generator, docs, task, or formats are meta work. A quoted cap
    request in a prompt/route test, replay, or read-only/no-file audit is test
    data, not a deliverable; sticky context
    cannot turn a hood, barrel, ring, mount, photo, or metadata request into a
    cap. Do not
    invoke generic graphic-design, logo, poster, product-visual, UI, CAD, or
    3D-design Skills—or any other design Skill—in parallel. Make focal length
    the first visual read and maximum aperture (F-stop/F-number/F value) the
    second. Before generation, read references/design-depth.md, translate one
    sourced fact into a hero system with two functionally distinct consequences,
    and bind its stable anchor id through the review and both consequences.
    A maker-culture layer may set the tone, but combine it with a verified
    lens-specific structural layer; never invent unique lore to force a sibling
    distinction. Minimalism is not stacked labels, one icon,
    or unexplained empty space. Bind the full-resolution completion review and
    every hashed quality-reference comparison to the exact candidate in a v2
    design brief; store reference roles in canonical arrays, never packed text. Keep rich
    concept exploration separate from printable reduction. For a zoom,
    preserve a numeric focal_length_mm anchor and an
    optional full-range focal_length_display token (for example 28–70mm). For fitted caps,
    ask one grouped question covering mating diameter, foam and uncompressed
    thickness, and friction ribs (enabled by default). Concept art may precede
    this intake, but for any fitted/printable/assembled/3MF request all three
    answers must be persisted before the first geometry/build/export/3MF
    command; do not enter production until that gate is complete (unless the
    current TOML already contains all three). If printable production is
    requested, finish and approve the artwork here, then hand it to
    $lens-cap-production. Treat saving the provider attachment, recording its
    hash, and marking human approval as an explicit handoff gate; never invent
    or self-attest those fields. If the user requested an actual 3MF, do not stop at artwork
    or a command suggestion: continue sequentially after approval and report
    success only when the verified .3mf exists.
