name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q lens_cap_pipeline
      - name: Check local bootstrap entry point
        run: python scripts/bootstrap.py --help
      - name: Check companion Skill manifest
        run: python scripts/install_skills.py check --dest .agents/skills --json
      - name: Run tests
        run: python -m pytest
      - name: Run portable smoke test
        run: python scripts/smoke.py
      - name: Run clean-room rehousing smoke test
        run: >-
          python scripts/smoke_rehouse.py
          --fixture examples/fixtures/helios-44-2-rehouse-imagegen-v3
          --bambu never --bridge-job jobs/95mm/job.toml --json
      - name: Check manifest-driven route shim
        run: >-
          python scripts/resolve_skill_route.py
          "为适马 28–70mm F2.8 设计圆形镜头盖正面并输出 3MF"
      - name: Run legacy multi-diameter ImageGen rehousing smoke test
        run: >-
          python scripts/smoke_rehouse.py
          --fixture examples/fixtures/helios-44-2-rehouse-imagegen-v2
          --bambu never --json
      - name: Run independent Mamiya rehousing smoke test
        run: >-
          python scripts/smoke_rehouse.py
          --fixture examples/fixtures/mamiya-sekor-c-80-f1-9-rehouse
          --bambu never --json
      - name: Replay clean-room user-agent transcripts
        run: |
          python scripts/rehearse_user_agent.py examples/rehearsals/helios-44-2-imagegen-v3-95mm-clean-room.json --bambu never --json
          python scripts/rehearse_user_agent.py examples/rehearsals/helios-44-2-rehouse-clean-room.json --bambu never --json
          python scripts/rehearse_user_agent.py examples/rehearsals/mamiya-sekor-c-80-f1-9-rehouse-clean-room.json --bambu never --json
      - name: Verify bundled 3MF Core fixtures
        run: |
          python tools/3mf_adapter/three_mf_adapter.py verify tools/3mf_adapter/fixtures/fixture-cube-standard.3mf
          python tools/3mf_adapter/three_mf_adapter.py verify tools/3mf_adapter/fixtures/fixture-cube-openscad.3mf
          python tools/3mf_adapter/three_mf_adapter.py verify tools/3mf_adapter/fixtures/fixture-cube-bambu-sliced.3mf --require-slice

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check lens_cap_pipeline tests scripts tools/3mf_adapter

  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Exercise repository batch launchers
        shell: cmd
        run: |
          bin\lens-cap-skills.cmd check --dest .agents\skills --json
          bin\lens-cap-3mf.cmd --help
      - name: Run cross-platform route and handoff tests
        run: >-
          python -m pytest -q
          tests/test_skill_sync.py
          tests/test_resolve_skill_route.py
          tests/test_rehearse_user_agent.py
      - name: Run portable smoke test
        run: python scripts/smoke.py
