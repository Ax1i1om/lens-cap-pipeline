name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q lens_cap_pipeline
      - name: Check local bootstrap entry point
        run: python scripts/bootstrap.py --help
      - name: Run tests
        run: python -m pytest
      - name: Run portable smoke test
        run: python scripts/smoke.py

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check lens_cap_pipeline tests scripts
